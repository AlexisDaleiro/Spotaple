name: Instalador de Windows

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: windows-installer-${{ github.ref }}

jobs:
  build:
    name: Compilar y probar el instalador
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:installer

      - name: Verificar archivos e instalación por usuario
        id: package
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -cnotmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'La versión debe ser estable y tener el formato X.Y.Z.'
          }
          $name = "Spotaple-Setup-$version.exe"
          $installer = Get-Item -LiteralPath "release/$name"
          $blockmap = Get-Item -LiteralPath "release/$name.blockmap"
          $metadata = Get-Content -LiteralPath release/latest.yml -Raw
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA512).Hash
          $sha512 = [Convert]::ToBase64String([Convert]::FromHexString($hash))
          if ($blockmap.Length -eq 0 -or
              $metadata -cnotmatch "(?m)^version: $([regex]::Escape($version))\r?$" -or
              $metadata -cnotmatch "(?m)^path: $([regex]::Escape($name))\r?$" -or
              $metadata -cnotmatch "(?m)^sha512: $([regex]::Escape($sha512))\r?$") {
            throw 'Los archivos de actualización no corresponden al instalador.'
          }

          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw "El instalador devolvió $($setup.ExitCode)." }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Spotaple'
          $app = Get-Item -LiteralPath (Join-Path $installed 'Spotaple.exe')
          if ($app.VersionInfo.FileVersion -ne $version) { throw 'La versión instalada no coincide.' }
          $feed = Get-Content -LiteralPath (Join-Path $installed 'resources\app-update.yml') -Raw
          if ($feed -cnotmatch '(?m)^provider: github\r?$' -or
              $feed -cnotmatch '(?m)^owner: AlexisDaleiro\r?$' -or
              $feed -cnotmatch '(?m)^repo: Spotaple\r?$') {
            throw 'La instalación no apunta al canal de actualizaciones de Spotaple.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Spotaple-Windows-x64-${{ steps.package.outputs.version }}
          path: |
            release/Spotaple-Setup-${{ steps.package.outputs.version }}.exe
            release/Spotaple-Setup-${{ steps.package.outputs.version }}.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  draft:
    name: Crear borrador en GitHub Releases
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'AlexisDaleiro/Spotaple'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Spotaple-Windows-x64-${{ needs.build.outputs.version }}
          path: release

      - name: Adjuntar archivos al borrador
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --json tagName >/dev/null 2>&1 ||
             gh api "repos/$GH_REPO/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "::error::Ya existe un release o tag $tag. Revisá el borrador existente o incrementá la versión."
            exit 1
          fi

          setup="release/Spotaple-Setup-$VERSION.exe"
          gh release create "$tag" "$setup" "$setup.blockmap" release/latest.yml \
            --target "$GITHUB_SHA" --draft --title "Spotaple $VERSION" --generate-notes
