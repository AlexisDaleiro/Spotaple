name: Prueba de macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:mac:preview -- --${{ matrix.arch }}
      - name: Probar la app empaquetada
        run: |
          bundle="$(find release -maxdepth 2 -name Spotaple.app -type d -print -quit)"
          test -n "$bundle"
          hdiutil verify release/*-mac-${{ matrix.arch }}.dmg
          codesign --verify --deep --strict "$bundle"
          NO_NETWORK=1 SPOTAPLE_EXE="$bundle/Contents/MacOS/Spotaple" npm run e2e:settings
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Spotaple-macOS-${{ matrix.arch }}
          path: release/*-mac-${{ matrix.arch }}.dmg
          if-no-files-found: error
          compression-level: 0
