name: APK de prueba de Android

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'build/icon.png'
      - '.github/workflows/android-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Generar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Usar Java 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: ./node_modules/.bin/expo prebuild --platform android --no-install
      - name: Compilar APK con el código de la app incluido
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2
      - name: Verificar el APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          application_id=$(node -p "require('./app.json').expo.android.package")
          "$tools/apksigner" verify --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" | grep -F "package: name='$application_id'"
          zipinfo -1 "$apk" | grep -Fx 'assets/index.android.bundle'
          mkdir -p dist
          cp "$apk" dist/Spotaple-Android-preview.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Spotaple-Android-preview
          path: mobile/dist/Spotaple-Android-preview.apk
          if-no-files-found: error
          compression-level: 0
